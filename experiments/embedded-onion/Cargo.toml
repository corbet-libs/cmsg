[package]
name = "cmsg-embedded-onion-experiment"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
cmsg = { path = "../.." }
arti-client = { version = "0.46.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "vanguards", "static-sqlite"] }
tor-hsservice = { version = "0.46.0", default-features = false }
tor-proto = { version = "0.46.0", default-features = false, features = ["hs-service", "tokio"] }
tor-cell = { version = "0.46.0", default-features = false }
futures = "0.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
tempfile = "3.23"
serde_json = "1.0"
data-encoding = "2.9"
ed25519-dalek = "3.0"
sha2 = "0.11"
safelog = "0.9.1"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }

[profile.test.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
