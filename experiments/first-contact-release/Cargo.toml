[package]
name = "cmsg-first-contact-release-experiment"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
cmsg = { path = "../.." }
chacha20poly1305 = "0.11.0"
data-encoding = "2.9"
ed25519-dalek = "3.0"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

[workspace]

[profile.test.package."*"]
opt-level = 3
