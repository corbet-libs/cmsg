[package]
name = "cmsg"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.97"
description = "Experimental browser and native MLS information transport core"
repository = "https://github.com/corbet-libs/cmsg"
license-file = "LICENSE.md"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE.md",
    "README.md",
    "src/**",
    "browser/**",
    "tests/**",
    "examples/**/*.rs",
    "docs/*.md",
    "studies/*.md",
    "experiments/**/*.md",
]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
schemars = "1"
url = "2"
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.5.0"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha3 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2.2"
p256 = { version = "0.13.2", features = ["ecdsa"] }
data-encoding = "2.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false }
axum = "0.8"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-socks = "0.5.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9.0", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# OpenMLS' provider uses rand_core 0.6 as well as the current RNG API.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Keep integration code debuggable while avoiding unrealistic debug-only crypto costs.
[profile.test.package."*"]
opt-level = 3
