[package]
name = "cmsg"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
description = "Device-local Member door and generated client projections"
repository = "https://github.com/corbet-libs/cmsg"
license-file = "LICENSE.md"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE.md",
    "README.md",
    "src/**",
    "tests/**",
    "examples/**/*.rs",
    "docs/*.md",
]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cbrd = { git = "https://github.com/corbet-libs/cbrd", branch = "main" }
schemars = "1"
url = "2"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
data-encoding = "2.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false }
axum = "0.8"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[features]
conformance = []

[[example]]
name = "client-conformance"
path = "tests/support/client-server.rs"
required-features = ["conformance"]
