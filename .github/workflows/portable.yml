name: Portable Rust and browser contracts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: implementation
  cancel-in-progress: false

jobs:
  contract:
    # GHA is primary; .crow/portable-core.yaml invokes the same script as fallback.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.suite == 'browser' && '["browser"]' || github.event_name == 'workflow_dispatch' && inputs.suite == 'core' && '["core"]' || '["core","browser"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CI_COMMIT_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CHECK_SUITE: ${{ matrix.suite }}
      RESOLVE_DEPENDENCIES: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read pinned cfrm profile revision
        if: matrix.suite == 'browser'
        id: cfrm-profile-pin
        shell: bash
        run: |
          set -euo pipefail
          cmsg_profile_revision="$(awk '
            $0 == "[archives.cfrm_profiles]" { selected=1; next }
            /^\[/ { selected=0 }
            selected && $1 == "revision" { gsub(/"/, "", $3); print $3 }
          ' .ci/archives.toml)"
          [[ "$cmsg_profile_revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$cmsg_profile_revision" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned public profile source
        if: matrix.suite == 'browser'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: corbet-libs/cfrm
          ref: ${{ steps.cfrm-profile-pin.outputs.revision }}
          path: .ci-dependencies/cfrm-profiles
          persist-credentials: false
      - name: Archive exact profile composition source
        if: matrix.suite == 'browser'
        shell: bash
        env:
          CFRM_PROFILE_REVISION: ${{ steps.cfrm-profile-pin.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C .ci-dependencies/cfrm-profiles rev-parse HEAD)" = "$CFRM_PROFILE_REVISION"
          cmsg_profile_archive="$RUNNER_TEMP/cfrm-profiles.tar"
          git -C .ci-dependencies/cfrm-profiles archive --format=tar --output="$cmsg_profile_archive" "$CFRM_PROFILE_REVISION"
          cmsg_profile_digest="$(sha256sum "$cmsg_profile_archive" | cut -d ' ' -f 1)"
          printf 'CFRM_PROFILES_SOURCE_ARCHIVE=%s\n' "$cmsg_profile_archive" >> "$GITHUB_ENV"
          printf 'CFRM_PROFILES_SOURCE_SHA256=%s\n' "$cmsg_profile_digest" >> "$GITHUB_ENV"
      - name: Prepare isolated runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          printf 'OPENSSL_INCLUDE_DIR=%s\n' "$(pkg-config --variable=includedir openssl)" >> "$GITHUB_ENV"
          printf 'OPENSSL_LIB_DIR=%s\n' "$(pkg-config --variable=libdir openssl)" >> "$GITHUB_ENV"
          if test "$CHECK_SUITE" = browser; then
            printf 'BROWSER_BIN=%s\n' "$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
            compiler_host="$(rustc -vV | sed -n 's/^host: //p')"
            printf 'WASM_LINKER=%s/lib/rustlib/%s/bin/rust-lld\n' "$(rustc --print sysroot)" "$compiler_host" >> "$GITHUB_ENV"
          fi
      - name: Check Rust formatting
        if: matrix.suite == 'core'
        run: cargo fmt --all -- --check
      - name: Run the shared contract
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/contract-evidence
        run: bash .ci/portable-checks.sh
      - name: Retain exact dependency and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-${{ matrix.suite }}
          path: ${{ runner.temp }}/contract-evidence
          if-no-files-found: warn
          retention-days: 7
