name: Rust community composition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: implementation
  cancel-in-progress: false
jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CI_COMMIT_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CHECK_SUITE: composition
      RESOLVE_DEPENDENCIES: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: corbet-libs/cfrm
          ref: 2c4fa47c59dfd8eb2fdc058ee171836ebc097d99
          path: .ci-dependencies/cfrm-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare exact component source
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          git -C .ci-dependencies/cfrm-source archive --format=tar 2c4fa47c59dfd8eb2fdc058ee171836ebc097d99 > "$RUNNER_TEMP/cfrm-source.tar"
          printf 'CFRM_SOURCE_ARCHIVE=%s/cfrm-source.tar\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CFRM_SOURCE_SHA256=%s\n' "$(sha256sum "$RUNNER_TEMP/cfrm-source.tar" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          printf 'OPENSSL_INCLUDE_DIR=%s\n' "$(pkg-config --variable=includedir openssl)" >> "$GITHUB_ENV"
          printf 'OPENSSL_LIB_DIR=%s\n' "$(pkg-config --variable=libdir openssl)" >> "$GITHUB_ENV"
      - name: Exercise signed identities and blind introduction admission
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/contract-evidence
        run: bash .ci/portable-checks.sh
      - name: Retain component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composition-evidence
          path: ${{ runner.temp }}/contract-evidence
          retention-days: 7
