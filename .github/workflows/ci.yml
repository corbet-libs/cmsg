name: ci
on:
  push:
    branches: [main]
    paths: ["Cargo.*", "src/**", "tests/**", "examples/**", "tools/**", ".ci/**", ".github/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: implementation
  cancel-in-progress: false
  queue: max
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python3 .ci/check-first-party.py
          cargo update
          npm update --prefix tools --package-lock-only --ignore-scripts --no-audit --no-fund
          rustc -Vv > resolution.txt
          date -u +%FT%TZ >> resolution.txt
          sha256sum Cargo.lock tools/package-lock.json >> resolution.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lock
          path: |
            Cargo.lock
            tools/package-lock.json
            resolution.txt
  dependency-policy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lock
      - run: python3 .ci/check-first-party.py
  check:
    needs: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Format and preserve corrections
        run: |
          cargo fmt --all
          git diff -- src tests examples > formatting.patch
          test ! -s formatting.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate every consumer surface from Rust
        run: |
          cargo run --locked --example registry > registry.json
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          node tools/generate.mjs registry.json generated
          node tools/check.mjs registry.json
          tools/node_modules/.bin/tsc --outDir generated/runtime --strict --target es2022 --module nodenext --moduleResolution nodenext generated/client.ts
      - name: Execute generated TypeScript against the actual local Door
        run: |
          cargo build --locked --features conformance --example client-conformance
          node tools/client-conformance.mjs target/debug/examples/client-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: generated-local-api
          path: generated
      - run: cargo clippy --locked --all-targets --keep-going -- -D warnings
      - run: cargo test --locked --all-targets
      - run: wasm-pack test --headless --chrome -- --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatting
          path: formatting.patch
  coverage:
    needs: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lock
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --branch --all-targets --json --output-path coverage.json --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --lcov --output-path coverage.lcov --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --text --output-path coverage.txt --ignore-filename-regex '/tests/'
      - run: python3 .ci/test-source-coverage.py
      - run: python3 .ci/check-source-coverage.py coverage.lcov coverage.json coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.json
            coverage.lcov
            coverage.txt
      - id: binding-version
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          packages = tomllib.load(open('Cargo.lock', 'rb'))['package']
          version = next(p['version'] for p in packages if p['name'] == 'wasm-bindgen')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          PYCODE
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.binding-version.outputs.version }}
      - run: python3 -m pip install -r .ci/requirements.txt
      - name: Measure actual browser Rust coverage
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: python3 .ci/browser-coverage-runner.py
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -Zno-profiler-runtime -Clink-args=--no-gc-sections --cfg=owned_browser_coverage
          WASM_BINDGEN_TEST_ONLY_WEB: "1"
          WASM_BINDGEN_SPLIT_LINKED_MODULES: "1"
          CHROMEDRIVER: /usr/bin/chromedriver
          CC_wasm32_unknown_unknown: clang
        run: cargo llvm-cov test --locked --branch --coverage-target-only --target wasm32-unknown-unknown --lib --test door --json --output-path wasm-coverage.json --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --target wasm32-unknown-unknown --lcov --output-path wasm-coverage.lcov --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --target wasm32-unknown-unknown --text --output-path wasm-coverage.txt --ignore-filename-regex '/tests/'
      - run: python3 .ci/check-source-coverage.py wasm-coverage.lcov wasm-coverage.json wasm-coverage.txt wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-coverage
          path: |
            wasm-coverage.json
            wasm-coverage.lcov
            wasm-coverage.txt
