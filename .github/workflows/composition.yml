name: Component composition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: implementation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cmsg
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: corbet-libs/cvld
          ref: 9d8dfb642a0a9e53eed8069a757d400c82cd4b11
          path: cvld
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: corbet-libs/cfrm
          ref: 507b63c775c4869d08f255d0a0c11866a2bf9249
          path: cfrm
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install public locked dependencies
        run: |
          npm ci --prefix cvld --ignore-scripts --no-audit --no-fund
          npm run --prefix cvld prepare:native
          npm ci --prefix cfrm/experiments/anonymous-permits --ignore-scripts --no-audit --no-fund
      - name: Build the native text participant
        working-directory: cmsg
        run: cargo build --locked --example composition
      - name: Exercise actual components with synthetic identities
        working-directory: cmsg
        run: node --test experiments/composition/composition.test.mjs
